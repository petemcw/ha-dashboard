      <path id="left-middle" fill="url(#orange)" d="M301 579 L408 543 L470 605 L487 729 C416 682 356 634 301 579 Z"/>
      <path id="left-lower" fill="url(#red)" d="M300 579 C349 628 415 681 487 729 C414 703 347 697 286 715 C323 762 369 785 413 811 C467 773 520 778 552 803 Z"/>
      <path id="left-inner" fill="url(#orange)" d="M474 649 C497 711 557 742 602 824 L610 750 C589 688 535 647 500 610 L467 605 Z"/>
      <path id="left-bottom" fill="#DA3B0F" d="M415 810 C470 774 524 775 553 799 L592 869 C516 838 446 846 367 896 Z"/>
      <path id="right-middle" fill="url(#orange)" d="M782 604 L851 543 L881 583 L953 577 C899 631 839 681 768 728 Z"/>
      <path id="right-lower" fill="url(#red)" d="M953 578 C890 641 837 684 768 728 C838 702 905 696 969 714 C930 759 877 793 839 814 C792 774 741 779 702 801 Z"/>
      <path id="right-inner" fill="#DE3C0E" d="M752 612 L784 604 C780 707 730 771 634 843 C629 765 669 694 752 612 Z"/>
      <path id="right-bottom" fill="url(#orange)" d="M699 802 C747 771 798 779 840 814 L884 894 C810 842 740 840 658 866 Z"/>
      <path id="right-bottom-tip" fill="url(#red)" d="M672 873 C744 840 808 845 884 894 L795 888 L772 900 L772 925 Z"/>
    </g>
  </g>

  <!-- Trunk joins the bottom house frame; the branch tips form the leaf veins. -->
