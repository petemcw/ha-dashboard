  <g id="maple-canopy">
    <use id="canopy-base" href="#leaf-shape" fill="url(#maple)"/>
    <g id="canopy-facets" clip-path="url(#leaf-clip)">
      <path id="center-left" fill="#BA2418" d="M626 292 L626 759 C616 653 560 539 506 473 L521 390 L566 411 Z"/>
      <path id="upper-left" fill="url(#red)" d="M437 443 C527 475 584 554 622 635 L610 754 C592 697 539 654 500 612 C473 580 453 511 437 443 Z"/>
