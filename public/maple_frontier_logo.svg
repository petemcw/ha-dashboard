<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title description">
  <title id="title">Maple Frontier</title>
  <desc id="description">A brown house with a chimney and white interior framing an orange and red maple tree. Recreated from the original icon using editable vector paths.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#542711"/>
      <stop offset="1" stop-color="#3E1C0D"/>
    </linearGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="1" y2="0.75">
      <stop stop-color="#B92016"/>
      <stop offset="0.5" stop-color="#EA4610"/>
      <stop offset="1" stop-color="#F36919"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#BC2218"/>
      <stop offset="1" stop-color="#991B13"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E6400D"/>
      <stop offset="1" stop-color="#F57520"/>
    </linearGradient>
    <path id="leaf-shape" d="M626 294 Q628 289 632 296 L688 394 Q697 409 708 403 L727 394 Q733 390 733 399 L734 463 Q734 479 746 473 Q785 452 807 447 Q815 444 813 453 Q787 548 767 590 Q760 606 752 612 Q767 616 781 603 L847 545 Q851 541 852 550 Q855 584 880 583 L946 578 Q955 577 951 587 L919 676 Q912 694 928 700 L963 711 Q970 713 964 720 Q907 777 849 802 Q832 809 841 823 L882 887 Q888 896 876 893 L799 888 Q770 886 772 911 Q773 925 762 920 L653 864 L590 864 L487 919 Q477 925 478 911 Q480 887 454 887 L375 894 Q363 897 370 886 L410 823 Q420 809 402 802 Q335 774 288 722 Q281 716 289 713 L320 701 Q339 694 333 678 L302 589 Q297 579 307 579 L372 584 Q397 587 400 552 Q400 540 408 548 L471 606 Q486 616 500 611 Q486 599 476 574 Q451 510 441 454 Q438 444 447 448 L502 473 Q517 480 518 463 L520 401 Q520 389 528 394 L541 401 Q554 411 563 397 Z"/>
    <clipPath id="leaf-clip"><use href="#leaf-shape"/></clipPath>
  </defs>

  <!-- House silhouette and inset: edit these paths to change the frame. -->
  <g id="house">
    <path id="house-frame" fill="url(#wood)" d="M141 493 L601 134 Q627 112 650 132 L861 308 L861 247 Q861 224 885 224 L979 224 Q1003 224 1003 248 L1003 418 L1117 519 Q1141 541 1122 561 Q1102 584 1070 559 L1070 1063 Q1070 1102 1029 1102 L222 1102 Q181 1102 181 1062 L181 539 Q157 558 137 543 Q110 523 141 493 Z"/>
