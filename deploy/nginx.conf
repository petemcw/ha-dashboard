server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The owner's house config (entity IDs), mounted from the host rather than baked into
    # the image, so editing it needs a reload, not a rebuild. Missing file means 404, which
    # the app turns into setup instructions.
    location = /home.json {
        alias /config/home.json;
        add_header Cache-Control "no-cache";
    }

    # Everything else (index.html, config.json, the SPA fallback) is revalidated,
    # so long-lived kiosk tabs pick up a new deploy on their next reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
